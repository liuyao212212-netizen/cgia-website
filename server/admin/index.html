<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGIA 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f;
      --card: #111118;
      --border: #1e1e2e;
      --gold: #f5d47a;
      --gold-dim: rgba(245, 212, 122, 0.15);
      --text: #e0e0e0;
      --text-dim: #888;
      --danger: #ff4d4d;
      --success: #4dff88;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Login */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 360px; }
    .login-box h1 { text-align: center; color: var(--gold); font-size: 22px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--gold); color: #000; font-weight: 600; font-size: 15px; cursor: pointer; }
    .login-box .error { color: var(--danger); font-size: 13px; text-align: center; margin-bottom: 12px; }

    /* Layout */
    .app { display: none; }
    .app.active { display: flex; }
    .sidebar { width: 220px; background: var(--card); border-right: 1px solid var(--border); padding: 20px 0; min-height: 100vh; flex-shrink: 0; }
    .sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .sidebar .logo h2 { color: var(--gold); font-size: 18px; }
    .sidebar .logo p { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
    .sidebar .nav-item { display: block; padding: 12px 20px; color: var(--text-dim); text-decoration: none; font-size: 14px; cursor: pointer; transition: all .2s; }
    .sidebar .nav-item:hover, .sidebar .nav-item.active { color: var(--gold); background: var(--gold-dim); }
    .sidebar .nav-item.active { border-right: 3px solid var(--gold); }
    .main { flex: 1; padding: 24px; overflow-y: auto; }
    .main h2 { color: var(--gold); font-size: 22px; margin-bottom: 20px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    /* Buttons */
    .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 500; transition: all .2s; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { filter: brightness(1.1); }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Upload */
    .upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: all .2s; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .upload-area:hover, .upload-area.dragover { border-color: var(--gold); background: rgba(245,212,122,0.05); }
    .upload-area .preview { max-width: 100%; max-height: 400px; border-radius: 8px; }
    .upload-area .hint { color: var(--text-dim); font-size: 14px; }
    .upload-area .hint small { display: block; margin-top: 6px; font-size: 12px; }

    /* News grid */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .news-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all .2s; }
    .news-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .news-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .news-card .info { padding: 14px; }
    .news-card .date { color: var(--text-dim); font-size: 12px; }
    .news-card .title { color: var(--text); font-size: 14px; margin-top: 6px; font-weight: 500; }
    .news-card .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .news-card .tag { background: var(--gold-dim); color: var(--gold); font-size: 11px; padding: 2px 8px; border-radius: 20px; }
    .news-card .actions { display: flex; gap: 8px; margin-top: 10px; }

    /* Toggle */
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
    .toggle input { accent-color: var(--gold); width: 16px; height: 16px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { color: var(--gold); font-size: 18px; margin-bottom: 20px; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Toast */
    .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 200; animation: slideIn .3s; }
    .toast-success { background: #1a3a2a; border: 1px solid var(--success); color: var(--success); }
    .toast-error { background: #3a1a1a; border: 1px solid var(--danger); color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar .logo h2, .sidebar .logo p, .sidebar .nav-item span { display: none; }
      .sidebar .nav-item { text-align: center; padding: 12px; }
    }
  </style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h1>CGIA 管理后台</h1>
    <div id="loginError" class="error" style="display:none"></div>
    <input id="loginUser" type="text" placeholder="用户名" value="admin">
    <input id="loginPass" type="password" placeholder="密码">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="appPage" class="app">
  <div class="sidebar">
    <div class="logo">
      <h2>CGIA</h2>
      <p>管理后台</p>
    </div>
    <a class="nav-item active" onclick="switchTab('news')" data-tab="news">📰 <span>资讯速递</span></a>
    <a class="nav-item" onclick="switchTab('members')" data-tab="members">👥 <span>会员管理</span></a>
    <a class="nav-item" onclick="switchTab('activities')" data-tab="activities">🎉 <span>活动中心</span></a>
    <a class="nav-item" onclick="switchTab('settings')" data-tab="settings">⚙️ <span>设置</span></a>
    <a class="nav-item" style="margin-top:auto;color:var(--danger)" onclick="doLogout()">🚪 <span>退出</span></a>
  </div>
  <div class="main">
    <!-- 资讯速递 -->
    <div id="tab-news" class="tab-content">
      <div class="card-header">
        <h2>资讯速递</h2>
        <button class="btn btn-gold" onclick="openNewsModal()">+ 添加速递</button>
      </div>
      <div id="newsList" class="news-grid"></div>
    </div>

    <!-- 会员管理 -->
    <div id="tab-members" class="tab-content" style="display:none">
      <div class="card-header">
        <h2>会员管理</h2>
        <button class="btn btn-gold" onclick="openMemberModal()">+ 添加会员</button>
      </div>
      <div id="membersList"></div>
    </div>

    <!-- 活动中心 -->
    <div id="tab-activities" class="tab-content" style="display:none">
      <div class="card-header">
        <h2>活动中心</h2>
        <button class="btn btn-gold" onclick="openActivityModal()">+ 添加活动</button>
      </div>
      <div id="activitiesList"></div>
    </div>

    <!-- 设置 -->
    <div id="tab-settings" class="tab-content" style="display:none">
      <h2>设置</h2>
      <div class="card">
        <h3 style="color:var(--gold);margin-bottom:16px">修改密码</h3>
        <div class="form-group">
          <label>原密码</label>
          <input id="oldPwd" type="password">
        </div>
        <div class="form-group">
          <label>新密码</label>
          <input id="newPwd" type="password">
        </div>
        <button class="btn btn-gold" onclick="changePassword()">保存密码</button>
      </div>
    </div>
  </div>
</div>

<!-- 模态框容器 -->
<div id="modalContainer"></div>

<script>
const API = window.location.origin + '/api'
let token = localStorage.getItem('cgia_token') || ''
let currentFile = null

// --- Auth ---
async function doLogin() {
  const username = document.getElementById('loginUser').value
  const password = document.getElementById('loginPass').value
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    const data = await res.json()
    if (data.token) {
      token = data.token
      localStorage.setItem('cgia_token', token)
      showApp()
    } else {
      document.getElementById('loginError').textContent = data.error || '登录失败'
      document.getElementById('loginError').style.display = 'block'
    }
  } catch (e) {
    document.getElementById('loginError').textContent = '网络错误'
    document.getElementById('loginError').style.display = 'block'
  }
}

function doLogout() {
  token = ''
  localStorage.removeItem('cgia_token')
  showLogin()
}

function showLogin() {
  document.getElementById('loginPage').style.display = 'flex'
  document.getElementById('appPage').classList.remove('active')
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none'
  document.getElementById('appPage').classList.add('active')
  loadNews()
}

// --- Tabs ---
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none')
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
  document.getElementById('tab-' + tab).style.display = 'block'
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active')
  if (tab === 'news') loadNews()
  if (tab === 'members') loadMembers()
  if (tab === 'activities') loadActivities()
}

// --- News ---
async function loadNews() {
  const res = await fetch(API + '/news', { headers: { Authorization: 'Bearer ' + token } })
  const posts = await res.json()
  const container = document.getElementById('newsList')
  if (!posts.length) {
    container.innerHTML = '<p style="color:var(--text-dim)">暂无资讯，点击右上角添加</p>'
    return
  }
  container.innerHTML = posts.map(p => `
    <div class="news-card">
      <img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">
      <div class="info">
        <div class="date">${p.date}</div>
        <div class="title">${p.title}</div>
        <div class="tags">${(p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="actions">
          <button class="btn btn-outline btn-sm" onclick='editNews(${JSON.stringify(p).replace(/'/g,"&#39;")})'>编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteNews(${p.id})">删除</button>
          <label class="toggle">
            <input type="checkbox" ${p.published ? 'checked' : ''} onchange="togglePublish(${p.id}, this.checked)">
            发布
          </label>
        </div>
      </div>
    </div>
  `).join('')
}

function openNewsModal(post = null) {
  currentFile = null
  const isEdit = !!post
  const today = new Date().toISOString().slice(0,10)
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:520px">
        <h3>${isEdit ? '编辑' : '添加'}资讯速递</h3>
        <div class="form-group">
          <label>海报图片 <span style="color:var(--text-dim);font-weight:normal">（拖拽 / 粘贴 / 点击上传）</span></label>
          <div class="upload-area" id="dropZone"
            onclick="document.getElementById('m_file').click()"
            ondragover="event.preventDefault();this.classList.add('dragover')"
            ondragleave="this.classList.remove('dragover')"
            ondrop="handleDrop(event)"
            tabindex="0"
          >
            <p class="hint" id="dropHint">
              点击上传 / 拖拽图片到此处
              <small>Ctrl+V 粘贴截图</small>
            </p>
            <img id="m_preview" class="preview" src="${post?.image || ''}" style="${post?.image ? '' : 'display:none'}">
            <input id="m_file" type="file" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-gold" id="saveBtn" onclick="saveNews(${post?.id || 'null'})">${isEdit ? '保存' : '添加'}</button>
        </div>
      </div>
    </div>`
  document.getElementById('modalContainer').innerHTML = html
  setTimeout(() => {
    const dropZone = document.getElementById('dropZone')
    if (dropZone) {
      dropZone.focus()
      dropZone.addEventListener('paste', handlePaste)
    }
  }, 50)
}

function handleDrop(e) {
  e.preventDefault()
  e.stopPropagation()
  e.target.closest('.upload-area').classList.remove('dragover')
  const files = e.dataTransfer.files
  if (files.length) processFile(files[0])
}

function handlePaste(e) {
  const items = e.clipboardData.items
  for (let item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault()
      const file = item.getAsFile()
      if (file) processFile(file)
      return
    }
  }
}

function handleFileSelect(input) {
  if (input.files[0]) processFile(input.files[0])
}

function processFile(file) {
  currentFile = file
  const reader = new FileReader()
  reader.onload = e => {
    const preview = document.getElementById('m_preview')
    const hint = document.getElementById('dropHint')
    if (preview) { preview.src = e.target.result; preview.style.display = 'block' }
    if (hint) hint.style.display = 'none'
  }
  reader.readAsDataURL(file)
}

function editNews(post) { openNewsModal(post) }

async function saveNews(id) {
  const btn = document.getElementById('saveBtn')
  
  // 如果没传图片且不是编辑模式
  if (!currentFile && !id) {
    return toast('请先上传海报图片', 'error')
  }

  let image = ''
  
  // 上传图片
  if (currentFile) {
    if (btn) { btn.disabled = true; btn.textContent = '上传中...' }
    const formData = new FormData()
    formData.append('file', currentFile)
    try {
      const upRes = await fetch(API + '/upload', { method: 'POST', body: formData })
      const upData = await upRes.json()
      if (upData.url) {
        image = upData.url
      } else {
        toast('图片上传失败', 'error')
        if (btn) { btn.disabled = false; btn.textContent = id ? '保存' : '添加' }
        return
      }
    } catch (e) {
      toast('图片上传出错', 'error')
      if (btn) { btn.disabled = false; btn.textContent = id ? '保存' : '添加' }
      return
    }
  }

  // 从文件名提取日期和标题
  let date = new Date().toISOString().slice(0, 10)
  let title = 'GEO资讯速递'
  const tags = ['跨境GEO', 'AI营销']
  
  if (currentFile) {
    const name = currentFile.name.replace(/\.[^.]+$/, '')
    const dateMatch = name.match(/(\d{4})[-_./]?(\d{2})[-_./]?(\d{2})/)
    if (dateMatch) {
      date = dateMatch[1] + '-' + dateMatch[2] + '-' + dateMatch[3]
    }
    title = name || 'GEO资讯速递'
  }

  // 编辑模式用现有数据
  if (id && !image) {
    // 只改发布状态，不改图片
    const body = { published: true }
    const res = await fetch(API + '/news/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body)
    })
    if (res.ok) { toast('保存成功'); closeModal(); loadNews() }
    else toast('保存失败', 'error')
    if (btn) { btn.disabled = false; btn.textContent = '保存' }
    return
  }

  const body = { date, title, image, tags, published: true }
  const url = id ? API + '/news/' + id : API + '/news'
  const method = id ? 'PUT' : 'POST'

  try {
    const res = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body)
    })
    if (res.ok) {
      toast(id ? '更新成功' : '添加成功')
      closeModal()
      loadNews()
    } else {
      const data = await res.json()
      toast(data.error || '操作失败', 'error')
    }
  } catch (e) {
    toast('网络错误', 'error')
  }
  if (btn) { btn.disabled = false; btn.textContent = id ? '保存' : '添加' }
}

async function deleteNews(id) {
  if (!confirm('确定删除？')) return
  await fetch(API + '/news/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
  toast('已删除')
  loadNews()
}

async function togglePublish(id, published) {
  await fetch(API + '/news/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ published })
  })
}

// --- Members ---
async function loadMembers() {
  const res = await fetch(API + '/members', { headers: { Authorization: 'Bearer ' + token } })
  const members = await res.json()
  const container = document.getElementById('membersList')
  if (!members.length) {
    container.innerHTML = '<p style="color:var(--text-dim)">暂无会员，点击右上角添加</p>'
    return
  }
  container.innerHTML = members.map(m => `
    <div class="card" style="display:flex;gap:16px;align-items:center">
      ${m.certificate_image ? `<img src="${m.certificate_image}" style="width:60px;height:60px;object-fit:cover;border-radius:10px">` : ''}
      <div style="flex:1">
        <div style="color:var(--gold);font-weight:600">${m.name}</div>
        <div style="color:var(--text-dim);font-size:13px">${m.company || '未填写公司'}</div>
        <div style="color:var(--text-dim);font-size:12px">${m.type === 'person' ? '个人会员' : '单位会员'}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick='editMember(${JSON.stringify(m).replace(/'/g,"&#39;")})'>编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMember(${m.id})">删除</button>
      </div>
    </div>
  `).join('')
}

function openMemberModal(member = null) {
  const isEdit = !!member
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${isEdit ? '编辑' : '添加'}会员</h3>
        <div class="form-group">
          <label>姓名/单位名</label>
          <input id="m_name" type="text" value="${member?.name || ''}">
        </div>
        <div class="form-group">
          <label>所属公司</label>
          <input id="m_company" type="text" value="${member?.company || ''}">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="m_type">
            <option value="company" ${member?.type === 'company' ? 'selected' : ''}>单位会员</option>
            <option value="person" ${member?.type === 'person' ? 'selected' : ''}>个人会员</option>
          </select>
        </div>
        <div class="form-group">
          <label>证书图片</label>
          <div class="upload-area" onclick="document.getElementById('m_cert_file').click()">
            <p style="color:var(--text-dim)">点击上传证书</p>
            <img id="m_cert_preview" class="preview" src="${member?.certificate_image || ''}" style="${member?.certificate_image ? '' : 'display:none'}">
            <input id="m_cert_file" type="file" accept="image/*" style="display:none" onchange="previewCertFile(this)">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-gold" onclick="saveMember(${member?.id || 'null'})">${isEdit ? '保存' : '添加'}</button>
        </div>
      </div>
    </div>`
  document.getElementById('modalContainer').innerHTML = html
}

function editMember(member) { openMemberModal(member) }

async function saveMember(id) {
  const name = document.getElementById('m_name').value
  const company = document.getElementById('m_company').value
  const type = document.getElementById('m_type').value

  let certificate_image = ''
  const fileInput = document.getElementById('m_cert_file')
  if (fileInput.files.length) {
    const formData = new FormData()
    formData.append('file', fileInput.files[0])
    const upRes = await fetch(API + '/upload', { method: 'POST', body: formData })
    const upData = await upRes.json()
    if (upData.url) certificate_image = upData.url
  }

  const body = { name, company, type, certificate_image, published: true }
  const url = id ? API + '/members/' + id : API + '/members'
  const method = id ? 'PUT' : 'POST'

  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body)
  })
  if (res.ok) { toast(id ? '更新成功' : '添加成功'); closeModal(); loadMembers() }
  else toast('操作失败', 'error')
}

async function deleteMember(id) {
  if (!confirm('确定删除？')) return
  await fetch(API + '/members/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
  toast('已删除')
  loadMembers()
}

// --- Activities ---
async function loadActivities() {
  const res = await fetch(API + '/activities', { headers: { Authorization: 'Bearer ' + token } })
  const activities = await res.json()
  const container = document.getElementById('activitiesList')
  if (!activities.length) {
    container.innerHTML = '<p style="color:var(--text-dim)">暂无活动，点击右上角添加</p>'
    return
  }
  container.innerHTML = activities.map(a => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="color:var(--gold);font-weight:600">${a.title}</div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:4px">${a.date || ''} ${a.location || ''}</div>
          <div style="color:var(--text-dim);font-size:12px;margin-top:2px">状态: ${a.status === 'upcoming' ? '即将开始' : a.status === 'ongoing' ? '进行中' : '已结束'}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline btn-sm" onclick='editActivity(${JSON.stringify(a).replace(/'/g,"&#39;")})'>编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteActivity(${a.id})">删除</button>
        </div>
      </div>
    </div>
  `).join('')
}

function openActivityModal(activity = null) {
  const isEdit = !!activity
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${isEdit ? '编辑' : '添加'}活动</h3>
        <div class="form-group"><label>标题</label><input id="m_act_title" type="text" value="${activity?.title || ''}"></div>
        <div class="form-group"><label>描述</label><textarea id="m_act_desc">${activity?.description || ''}</textarea></div>
        <div class="form-group"><label>日期</label><input id="m_act_date" type="date" value="${activity?.date || ''}"></div>
        <div class="form-group"><label>地点</label><input id="m_act_location" type="text" value="${activity?.location || ''}"></div>
        <div class="form-group">
          <label>状态</label>
          <select id="m_act_status">
            <option value="upcoming" ${activity?.status === 'upcoming' ? 'selected' : ''}>即将开始</option>
            <option value="ongoing" ${activity?.status === 'ongoing' ? 'selected' : ''}>进行中</option>
            <option value="ended" ${activity?.status === 'ended' ? 'selected' : ''}>已结束</option>
          </select>
        </div>
        <div class="form-group">
          <label>封面图</label>
          <div class="upload-area" onclick="document.getElementById('m_act_file').click()">
            <p style="color:var(--text-dim)">点击上传封面</p>
            <img id="m_act_preview" class="preview" src="${activity?.image || ''}" style="${activity?.image ? '' : 'display:none'}">
            <input id="m_act_file" type="file" accept="image/*" style="display:none" onchange="previewActFile(this)">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-outline" onclick="closeModal()">取消</button>
          <button class="btn btn-gold" onclick="saveActivity(${activity?.id || 'null'})">${isEdit ? '保存' : '添加'}</button>
        </div>
      </div>
    </div>`
  document.getElementById('modalContainer').innerHTML = html
}

function editActivity(a) { openActivityModal(a) }

async function saveActivity(id) {
  const title = document.getElementById('m_act_title').value
  const description = document.getElementById('m_act_desc').value
  const date = document.getElementById('m_act_date').value
  const location = document.getElementById('m_act_location').value
  const status = document.getElementById('m_act_status').value

  let image = ''
  const fileInput = document.getElementById('m_act_file')
  if (fileInput.files.length) {
    const formData = new FormData()
    formData.append('file', fileInput.files[0])
    const upRes = await fetch(API + '/upload', { method: 'POST', body: formData })
    const upData = await upRes.json()
    if (upData.url) image = upData.url
  }

  const body = { title, description, date, location, status, image, published: true }
  const url = id ? API + '/activities/' + id : API + '/activities'
  const method = id ? 'PUT' : 'POST'

  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body)
  })
  if (res.ok) { toast(id ? '更新成功' : '添加成功'); closeModal(); loadActivities() }
  else toast('操作失败', 'error')
}

async function deleteActivity(id) {
  if (!confirm('确定删除？')) return
  await fetch(API + '/activities/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
  toast('已删除')
  loadActivities()
}

// --- Settings ---
async function changePassword() {
  const oldPassword = document.getElementById('oldPwd').value
  const newPassword = document.getElementById('newPwd').value
  const res = await fetch(API + '/auth/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ oldPassword, newPassword })
  })
  const data = await res.json()
  if (res.ok) toast('密码修改成功')
  else toast(data.error || '修改失败', 'error')
}

// --- Utils ---
function previewCertFile(input) {
  if (input.files[0]) {
    const reader = new FileReader()
    reader.onload = e => {
      document.getElementById('m_cert_preview').src = e.target.result
      document.getElementById('m_cert_preview').style.display = 'block'
    }
    reader.readAsDataURL(input.files[0])
  }
}
function previewActFile(input) {
  if (input.files[0]) {
    const reader = new FileReader()
    reader.onload = e => {
      document.getElementById('m_act_preview').src = e.target.result
      document.getElementById('m_act_preview').style.display = 'block'
    }
    reader.readAsDataURL(input.files[0])
  }
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = ''
  currentFile = null
}

function toast(msg, type = 'success') {
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 3000)
}

// --- Init ---
if (token) {
  showApp()
} else {
  showLogin()
}
</script>
